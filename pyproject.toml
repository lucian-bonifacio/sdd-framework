[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-framework"
version = "0.1.0"
description = "Planejamento e governança de projetos para agentes de IA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sdd = "sdd_framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sdd_framework = ["assets/**/*"]
